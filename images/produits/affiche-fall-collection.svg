<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1075" viewBox="0 0 860 1075">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e7a1"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d14"/>
    </linearGradient>
    <linearGradient id="orVif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a3"/>
      <stop offset="100%" stop-color="#c9992a"/>
    </linearGradient>
    <radialGradient id="lueur" cx="80%" cy="15%" r="80%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="860" height="1075" fill="#0d0b07"/>
  <rect width="860" height="1075" fill="url(#lueur)"/>
  <circle cx="120" cy="950" r="180" fill="#d4af37" opacity="0.08"/>
  <circle cx="760" cy="220" r="140" fill="#d4af37" opacity="0.1"/>

  <!-- Feuilles -->
  <g fill="#2f7a3d" opacity="0.9">
    <path d="M60 180 q60 -40 120 0 q-60 40 -120 0z"/>
    <path d="M740 850 q60 -40 120 0 q-60 40 -120 0z" opacity="0.7"/>
  </g>
  <g stroke="#3f9c50" stroke-width="3" fill="none" opacity="0.8">
    <path d="M80 185 q50 -30 100 -4"/>
    <path d="M760 855 q50 -30 100 -4"/>
  </g>

  <!-- Slogan -->
  <text x="430" y="115" text-anchor="middle" font-family="Segoe Script, Brush Script MT, cursive" font-size="58" fill="#fff" font-style="italic">Révélez votre</text>
  <text x="430" y="195" text-anchor="middle" font-family="Segoe Script, Brush Script MT, cursive" font-size="72" fill="url(#or)" font-style="italic" font-weight="bold">beauté naturelle</text>
  <text x="430" y="262" text-anchor="middle" font-family="Segoe Script, Brush Script MT, cursive" font-size="44" fill="#fff" font-style="italic">avec <tspan fill="url(#or)" font-weight="bold">FC</tspan> !</text>

  <!-- Pot du produit -->
  <g transform="translate(430 560)">
    <ellipse cx="0" cy="185" rx="190" ry="26" fill="#000" opacity="0.55"/>
    <!-- corps -->
    <rect x="-170" y="20" width="340" height="165" rx="16" fill="#fbf6e8"/>
    <!-- couvercle -->
    <rect x="-185" y="-18" width="370" height="52" rx="20" fill="#fff"/>
    <rect x="-185" y="-18" width="370" height="52" rx="20" fill="none" stroke="#e8e0cf" stroke-width="3"/>
    <!-- étiquette -->
    <rect x="-170" y="20" width="340" height="165" rx="16" fill="none" stroke="url(#or)" stroke-width="4"/>
    <rect x="-150" y="40" width="150" height="125" rx="10" fill="#120f08"/>
    <circle cx="-75" cy="88" r="30" fill="none" stroke="url(#or)" stroke-width="3"/>
    <text x="-75" y="99" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="url(#orVif)">FC</text>
    <text x="-75" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#f0d98a">FALL COLLECTION</text>
    <text x="60" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#120f08">Traitement</text>
    <text x="60" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#120f08">Capillaire</text>
    <text x="60" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#8c6d14">🌿 100% naturel</text>
  </g>

  <!-- Bénéfices -->
  <g font-family="Segoe UI, sans-serif" font-size="24" fill="#f5f0dd">
    <g transform="translate(430 760)">
      <rect x="-320" y="-24" width="300" height="52" rx="26" fill="none" stroke="url(#or)" stroke-width="2"/>
      <text x="-170" y="8" text-anchor="middle">🌱 Croissance des cheveux</text>
      <rect x="30" y="-24" width="290" height="52" rx="26" fill="none" stroke="url(#or)" stroke-width="2"/>
      <text x="175" y="8" text-anchor="middle">💧 Nutrition profonde</text>
    </g>
    <g transform="translate(430 825)">
      <rect x="-320" y="-24" width="330" height="52" rx="26" fill="none" stroke="url(#or)" stroke-width="2"/>
      <text x="-155" y="8" text-anchor="middle">✨ Brillance et douceur</text>
    </g>
  </g>

  <!-- Bandeau bas -->
  <rect x="30" y="890" width="800" height="150" rx="24" fill="url(#or)"/>
  <text x="430" y="952" text-anchor="middle" font-family="Segoe Script, Brush Script MT, cursive" font-size="52" fill="#120f08" font-weight="bold" font-style="italic">Fall Collection</text>
  <text x="430" y="992" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" letter-spacing="4" fill="#120f08">— FC · LA BEAUTÉ AU NATUREL —</text>
  <text x="430" y="1026" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#0d6e33">💬 Commandez dès maintenant : 78 951 38 48</text>

  <!-- Note provisoire -->
  <text x="430" y="1066" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#7a7668">🇸🇳 Visuel provisoire — remplacé par votre affiche dès qu'elle est enregistrée dans images/produits/</text>
</svg>
